<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f0e8;
            color: #1f2430;
        }
        .wrap {
            max-width: 780px;
            margin: 64px auto;
            padding: 32px;
            background: #fffaf3;
            border: 1px solid #e9dccd;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(77, 48, 28, 0.10);
        }
        h1 {
            margin-top: 0;
            font-size: 2.2rem;
        }
        p {
            line-height: 1.7;
            color: #575d69;
        }
        a {
            color: #c95c2b;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="wrap">
        <h1>Page Not Found</h1>
        <p>The page you requested does not exist on this backend service.</p>
        <p>This deployment mainly exposes API endpoints. Start from <a href="/">home</a> or open <a href="/swagger-ui.html">Swagger UI</a>.</p>
    </main>
</body>
</html>
